name: Publish working-draft bundle

on:
  push:
    tags:
      - 'v*-draft.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Test installer and bundle
        run: python3 -m unittest discover -s tests -v
      - name: Build complete bundle
        run: python3 tools/build_release.py --version "${GITHUB_REF_NAME#v}"
      - name: Publish bundle and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/pls-release-notes.md <<'NOTES'
          Complete PLS working-draft bundle: independently selectable layout,
          Journal, and design-writing skills, guides, Python installer,
          instructions, and license.
          The Journal skill includes retrievable discussion and decision
          history and selective reading. PLS owns configurable disposable
          context placement.
          PLS also includes a copyable basic project map at assets/project-map.md
          inside its skill folder. Configure a documentation root and individual
          area overrides for project or vault locations. Existing mapped owners
          remain authoritative until an authorized migration is completed.
          Download pls.zip and extract it. From the target project, use Python 3.10 or newer:

          - `python3 /path/to/pls/install.py install` installs only the PLS layout skill.
          - `python3 /path/to/pls/install.py install --skill journal` installs only the Journal skill.
          - `python3 /path/to/pls/install.py install --skill design-writing` installs only the design-writing skill.

          Each skill is self-contained and has its own installed updater. Run `install.py update` inside the installed skill to update that skill; updating PLS does not silently install Journal or design-writing.
          Old PLS-contained journaling moves to Journal in v0.3.0-draft.5. Draft4 bundled the Journal guide inside PLS. Use this bundle's installer to update the existing PLS installation, then install Journal separately when needed.
          This is a working draft, not a stable PLS standard release.
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            "releases/${GITHUB_REF_NAME#v}/pls.zip" \
            "releases/${GITHUB_REF_NAME#v}/pls.zip.sha256" \
            --verify-tag --prerelease --title "PLS $GITHUB_REF_NAME" \
            --notes-file /tmp/pls-release-notes.md
